{{ define "layout" }}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiryMesh — {{ .Title }}</title>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title">MiryMesh S3</h1>
    <nav class="topbar__nav">
      <a href="/static/index.html" class="topbar__link {{ if eq .Active "dashboard" }}topbar__link--active{{ end }}">Dashboard</a>
      <a href="/static/nodes.html" class="topbar__link {{ if eq .Active "nodes" }}topbar__link--active{{ end }}">Nodes</a>
      <a href="/static/disks.html" class="topbar__link {{ if eq .Active "disks" }}topbar__link--active{{ end }}">Disks</a>
      <a href="/static/buckets.html" class="topbar__link {{ if eq .Active "buckets" }}topbar__link--active{{ end }}">Buckets</a>
      <a href="/static/jobs.html" class="topbar__link {{ if eq .Active "jobs" }}topbar__link--active{{ end }}">Jobs</a>
      <a href="/api-doc" class="topbar__link">API Doc</a>
    </nav>
  </header>
  <main class="container">
    {{ block "content" . }}{{ end }}
  </main>
  <script src="/static/js/api.js"></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
{{ end }}
