services:
  mirymesh-dev:
    build:
      context: .
      dockerfile: packaging/docker/Dockerfile.dev
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - .:/src
      - /src/tmp
    environment:
      - MIRYMESH_MASTER_KEY=dev-master-key-32chars-1234567890
    command: air -c .air.toml
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: mirymesh, POSTGRES_PASSWORD: mirymesh, POSTGRES_DB: mirymesh }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes: { pgdata: {} }
