run:
  timeout: 3m
  go: "1.22"
linters:
  enable:
    - govet
    - ineffassign
    - misspell
    - unused
linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
  misspell:
    locale: US
