version: "2"
run:
  timeout: 3m
linters:
  enable:
    - govet
    - ineffassign
    - misspell
    - unused
  exclusions:
    presets:
      - common-false-positives
    rules:
      - linters: [errcheck]
        path: internal/datanode/
      - linters: [errcheck]
        path: internal/s3api/
      - linters: [errcheck]
        path: tests/
      - linters: [staticcheck]
        path: internal/s3api/
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    misspell:
      locale: US
